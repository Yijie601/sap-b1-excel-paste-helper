name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore and build
        run: dotnet build .\SapB1ExcelHelper\SapB1ExcelHelper.csproj -c Release

      - name: Run smoke tests
        run: dotnet run --project .\tests\SapB1ExcelHelper.SmokeTests\SapB1ExcelHelper.SmokeTests.csproj -c Release

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish .\SapB1ExcelHelper\SapB1ExcelHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:APP_VERSION `
            -o .\artifacts\publish
          Compress-Archive -Path .\artifacts\publish\* `
            -DestinationPath ".\artifacts\SapB1ExcelHelper-$env:APP_VERSION-win-x64.zip" `
            -Force

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\installer -Force | Out-Null
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            throw 'NSIS compiler was not found after installation.'
          }
          & $compiler "/DAPP_VERSION=$env:APP_VERSION" .\installer\SapB1ExcelHelper.nsi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SapB1ExcelHelper-${{ env.APP_VERSION }}-win-x64
          path: |
            artifacts/installer/*.exe
            artifacts/*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--title', "SAP B1 Excel Helper $env:GITHUB_REF_NAME",
            '--generate-notes'
          )
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $arguments += '--prerelease'
          }
          $files = @(
            (Get-ChildItem .\artifacts\installer\*.exe).FullName,
            (Resolve-Path ".\artifacts\SapB1ExcelHelper-$env:APP_VERSION-win-x64.zip").Path
          )
          gh @arguments @files
